  <rect x="18" y="47" width="20" height="4" rx="2" fill="#38BDF8" opacity="0.75"/>
  <circle cx="38" cy="49" r="3.5" fill="#38BDF8"/>
  <rect x="18" y="56" width="18" height="5" rx="2" fill="#334155"/>
