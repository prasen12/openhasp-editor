  <rect x="56" y="8" width="6" height="6" rx="1.5" fill="#38BDF8"/>
  <rect x="6" y="70" width="6" height="6" rx="1.5" fill="#38BDF8"/>
  <rect x="56" y="70" width="6" height="6" rx="1.5" fill="#38BDF8"/>

