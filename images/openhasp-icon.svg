  <path d="M82 78 A14 14 0 0 1 108 78" fill="none" stroke="#1A3A1A" stroke-width="4" stroke-linecap="round"/>
  <path d="M82 78 A14 14 0 0 1 100 64" fill="none" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="64" r="2.5" fill="#22C55E"/>

