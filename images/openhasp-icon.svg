    <circle cx="18" cy="74" r="1.1"/><circle cx="32" cy="74" r="1.1"/><circle cx="46" cy="74" r="1.1"/><circle cx="60" cy="74" r="1.1"/><circle cx="74" cy="74" r="1.1"/><circle cx="88" cy="74" r="1.1"/><circle cx="102" cy="74" r="1.1"/><circle cx="116" cy="74" r="1.1"/>
    <circle cx="18" cy="88" r="1.1"/><circle cx="32" cy="88" r="1.1"/><circle cx="46" cy="88" r="1.1"/><circle cx="60" cy="88" r="1.1"/><circle cx="74" cy="88" r="1.1"/><circle cx="88" cy="88" r="1.1"/><circle cx="102" cy="88" r="1.1"/><circle cx="116" cy="88" r="1.1"/>
