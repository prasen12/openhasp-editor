  <rect x="13" y="82" width="44" height="30" rx="5" fill="#0F1A2E" stroke="#38BDF8" stroke-width="0.8" opacity="0.5"/>
  <rect x="18" y="90" width="32" height="5" rx="2" fill="#38BDF8" opacity="0.2"/>
  <rect x="18" y="100" width="20" height="5" rx="2" fill="#38BDF8" opacity="0.15"/>

